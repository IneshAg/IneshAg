<svg xmlns="http://www.w3.org/2000/svg" width="490" height="260" viewBox="0 0 490 260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
