  <rect class="scan" width="1000" height="40" fill="#fff" opacity=".03"/>
</g>
<rect x="1" y="1" width="998" height="358" rx="23" fill="none" stroke="url(#nameSpread)" stroke-width="2" opacity=".8"/>

<g class="in d1"><text x="500.0" y="92" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#22d3ee" letter-spacing="6">&lt; HELLO WORLD, I'M /&gt;</text></g>
