<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="nameSpread" x1="0" x2="1" spreadMethod="reflect">
    <stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="b1"><stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <radialGradient id="b2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".40"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="b3"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  </pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="r"><rect width="1000" height="360" rx="24"/></clipPath>
  <style>
    .tw { animation: tw 4s ease-in-out infinite; opacity: .2 }
    @keyframes tw { 50% { opacity: .9 } }
    .f1 { animation: f1 14s ease-in-out infinite } @keyframes f1 { 50% { transform: translate(120px, 40px) } }
    .f2 { animation: f2 18s ease-in-out infinite } @keyframes f2 { 50% { transform: translate(-140px, -30px) } }
    .f3 { animation: f3 16s ease-in-out infinite } @keyframes f3 { 50% { transform: translate(60px, -50px) } }
    .in { opacity: 0; animation: in .9s ease-out forwards }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .4s } .d3 { animation-delay: .7s } .d4 { animation-delay: 1s }
    @keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .scan { animation: scan 6s linear infinite } @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(360px) } }
    .blink { animation: bl 1s steps(1) infinite } @keyframes bl { 50% { opacity: 0 } }
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1000" height="360" fill="#07070f"/>
  <rect width="1000" height="360" fill="url(#grid)"/>
