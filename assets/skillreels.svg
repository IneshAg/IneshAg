  <clipPath id="c"><rect x="2" y="2" width="486" height="256" rx="20"/></clipPath>
  <style>.pulse { animation: pu 3s ease-in-out infinite } @keyframes pu { 50% { opacity: .45 } }</style>
</defs>
<rect x="1" y="1" width="488" height="258" rx="21" fill="none" stroke="url(#bd)" stroke-width="2.5"/>
<g clip-path="url(#c)">
  <rect width="490" height="260" fill="#07070f"/>
  <rect class="pulse" width="490" height="260" fill="url(#gl)"/>
  <rect width="490" height="260" fill="url(#gl2)"/>
